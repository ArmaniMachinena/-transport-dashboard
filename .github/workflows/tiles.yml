name: Проверка подложек

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Запросить по тайлу из каждого источника
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          OWM_KEY: ${{ secrets.OWM_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          TF_KEY: ${{ secrets.TF_KEY }}
          STADIA_KEY: ${{ secrets.STADIA_KEY }}
        run: node scripts/check-tiles.mjs tiles
      - name: Контрольный лист в журнал (base64)
        if: always()
        run: |
          if [ -f tiles/sheet.jpg ]; then echo "SHEET_BEGIN"; base64 -w0 tiles/sheet.jpg; echo; echo "SHEET_END"; fi
      - name: Тайлы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiles
          path: tiles
