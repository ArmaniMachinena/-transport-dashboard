name: Живые данные

# Планировщик GitHub запускает задачи примерно раз в час, поэтому одна задача
# работает ~55 минут и каждые ~5 минут обновляет данные в ветке live-data.
# Страница читает их напрямую из этой ветки (raw.githubusercontent.com).
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Взять прошлые данные из ветки live-data
        run: |
          mkdir -p live
          git fetch --depth 1 origin live-data 2>/dev/null && git --work-tree=live checkout FETCH_HEAD -- . || echo "ветки live-data ещё нет"
          ls -la live || true
      - name: Собирать и публиковать данные ~55 минут
        run: |
          START=$(date +%s)
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          i=0
          while :; do
            i=$((i+1)); echo "=== Проход $i, $(date -u +%H:%M:%S) UTC ==="
            node scripts/fetch-live.mjs live || echo "сбор завершился с ошибкой, публикуем что есть"
            rm -rf live/.git
            git -C live init -q
            git -C live config user.name "github-actions[bot]"
            git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C live checkout -q --orphan live-data
            git -C live add -A
            git -C live commit -qm "Данные $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git -C live push -q -f "$REMOTE" live-data || echo "push не удался, повторим на следующем проходе"
            ELAPSED=$(( $(date +%s) - START ))
            [ $ELAPSED -ge 3120 ] && break   # 52 минуты
            sleep 240
          done
          echo "Сделано проходов: $i"
