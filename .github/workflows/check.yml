name: Проверка сайта

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить браузер
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Открыть сайт и проверить
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node scripts/check-site.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" shots
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
